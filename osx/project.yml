# XcodeGen spec — generates a proper macOS .app target (real bundle identity).
# Install XcodeGen once:  brew install xcodegen
# Generate the project:   cd <this folder> && xcodegen generate
# Then open AutoSwitchKVM.xcodeproj and Run.
#
# The Swift Package (Package.swift) still works for quick runs; this is the path
# to a real .app bundle and, later, signing/notarization.

name: AutoSwitchKVM
options:
  bundleIdPrefix: com.enginal
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

# Sparkle (automatic updates) is linked only into this .app target. The SwiftPM build used by
# the tests and CI stays dependency-free; AppUpdater compiles the updater `#if canImport(Sparkle)`.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"

targets:
  AutoSwitchKVM:
    type: application
    platform: macOS
    sources:
      - path: Sources/AutoSwitchKVM
      - path: Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleName: AutoSwitchKVM
        CFBundleDisplayName: AutoSwitch KVM
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: "AutoSwitch KVM connects and disconnects your Bluetooth devices when your KVM switches this Mac in and out."
        NSBluetoothPeripheralUsageDescription: "AutoSwitch KVM connects and disconnects your Bluetooth devices when your KVM switches this Mac in and out."
        # Sparkle: the appcast is attached to the latest *stable* GitHub release by
        # .github/workflows/macos-release.yml (pre-releases are never "latest").
        SUFeedURL: "https://github.com/casab/AutoSwitchKVM/releases/latest/download/appcast.xml"
        SUEnableAutomaticChecks: true
        # Public half of the EdDSA key that signs updates (Sparkle's generate_keys; the private
        # half is the SPARKLE_ED_PRIVATE_KEY repository secret, and the key also lives in the
        # maintainer's login keychain). Empty = updater off.
        SUPublicEDKey: "POszCs7yFBHJXf6WCYTYIMhEKa/giXrTXH0a2XB+OCg="
    dependencies:
      - sdk: IOKit.framework
      - sdk: IOBluetooth.framework
      - sdk: CoreBluetooth.framework
      - sdk: UserNotifications.framework
      - sdk: Carbon.framework
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enginal.AutoSwitchKVM
        PRODUCT_NAME: AutoSwitchKVM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Swift 5 *language mode* (matches Package.swift's swiftLanguageModes: [.v5]).
        # Building requires a Swift 6 toolchain — Xcode 16+ — because the sources use Swift 6
        # compiler features (e.g. @preconcurrency conformances, SE-0423).
        SWIFT_VERSION: "5.0"
        # Apple-recommended build settings (harmless; we keep the macOS 13 deployment target).
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # --- Signing ---
        # Default: self-signed / "Sign to Run Locally" (ad-hoc, no Apple account needed).
        # Builds and runs out of the box.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # To sign with your Apple Developer account instead (sturdier — TCC permissions and
        # notifications persist across rebuilds), uncomment the next line with your 10-char
        # Team ID (Xcode ▸ Settings ▸ Accounts ▸ your Apple ID ▸ team, or developer.apple.com
        # ▸ Membership) and change CODE_SIGN_IDENTITY above to "Apple Development":
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        #
        # Hardened runtime is required only for Developer ID notarization (a later step); leave
        # off for local development.
        ENABLE_HARDENED_RUNTIME: NO
