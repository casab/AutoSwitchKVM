# Test build for the AutoSwitch module (CI and ci/build.sh): ZMK + the raw HID transport. The
# module itself comes from this repository checkout (ZMK_EXTRA_MODULES).
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: zzeneg
      url-base: https://github.com/zzeneg
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-raw-hid
      remote: zzeneg
      revision: main
  self:
    path: config
