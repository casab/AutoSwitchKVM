name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: osx
    steps:
      - uses: actions/checkout@v4
      # The package requires a Swift 6 toolchain (swift-tools-version 6.0; the code uses e.g.
      # @preconcurrency conformances, SE-0423). Pin the Xcode MAJOR rather than latest-stable so
      # a new Xcode release can't break main with zero code changes.
      - name: Select Xcode (Swift 6 toolchain)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.x"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos-lint:
    name: Format lint
    runs-on: macos-15
    defaults:
      run:
        working-directory: osx
    steps:
      - uses: actions/checkout@v4
      # Use the swift-format bundled with the pinned Xcode toolchain (Xcode 16+) instead of a
      # floating brew formula — a new swift-format release could otherwise change lint results
      # with zero code changes.
      - name: Select Xcode (Swift 6 toolchain)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.x"
      - name: Lint
        run: xcrun swift-format lint --recursive --strict Sources Tests

  windows-core:
    name: Build & test (Windows Core)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore Core Tests
        run: dotnet restore tests/AutoSwitchKVM.Core.Tests/AutoSwitchKVM.Core.Tests.csproj
      - name: Test Core
        run: dotnet test tests/AutoSwitchKVM.Core.Tests/AutoSwitchKVM.Core.Tests.csproj -c Release
      - name: Restore App
        run: dotnet restore src/AutoSwitchKVM.App/AutoSwitchKVM.App.csproj -p:Platform=x64
      - name: Build App
        run: dotnet build src/AutoSwitchKVM.App/AutoSwitchKVM.App.csproj -c Release -p:Platform=x64 --no-restore
