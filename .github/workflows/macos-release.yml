# macOS release: on a `vX.Y.Z` tag (the same tags as windows-release.yml), build the universal
# .app with osx/tools/release.sh, package it as a DMG, and attach it to the GitHub release that the
# Windows workflow creates for that tag. For stable tags, also attach the Sparkle appcast that
# installed copies check for updates (pre-releases are never offered as updates).
#
# Repository secrets (all optional; the release still works without them):
#   MACOS_SIGNING_P12           base64 of a .p12 with a code-signing certificate + key. Without an
#   MACOS_SIGNING_P12_PASSWORD  Apple Developer ID this is a self-made certificate: it doesn't avoid
#                               Gatekeeper's first-open prompt, but it keeps the app's identity
#                               fixed, so macOS keeps the Bluetooth permission across updates.
#                               Missing: ad-hoc signing (the permission is asked again per update).
#   SPARKLE_ED_PRIVATE_KEY      the private EdDSA key from Sparkle's `generate_keys -x`. Missing: no
#                               appcast is published, so installed copies see no update.
name: macOS release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.10.1"
  SPARKLE_SHA256: "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27"

jobs:
  release:
    name: Build, package, attach to the release
    runs-on: macos-15
    defaults:
      run:
        working-directory: osx
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6 toolchain)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.x"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No MACOS_SIGNING_P12 secret: ad-hoc signing."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          # A self-made certificate isn't trusted, so list identities without -v (valid only).
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/\)/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No code-signing identity in MACOS_SIGNING_P12"
            exit 1
          fi
          echo "Signing with $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          OUT_DIR: build/release
        run: tools/release.sh "$TAG"

      - name: Write the Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "Pre-release: no appcast (installed copies only update to stable releases)."
            exit 0
          fi
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::No SPARKLE_ED_PRIVATE_KEY secret: no appcast, so installed copies won't see this update."
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          VERSION="${TAG#v}"
          SPARKLE_BIN="$RUNNER_TEMP/sparkle/bin" tools/make-appcast.sh "$TAG" \
            "build/release/AutoSwitchKVM-$VERSION-macos.dmg" "${{ github.run_number }}" build/release/appcast.xml

      - name: Wait for the release (created by the Windows workflow)
        run: |
          # Both workflows start on the same tag; Windows creates the release (Velopack publishes
          # it). Creating it here too could race that, so wait for it instead (up to 40 min).
          for i in $(seq 1 80); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Release $TAG never appeared. Did the Windows release workflow fail? The DMG is in the run's artifacts."
          exit 1

      - name: Attach the DMG (and appcast) to the release
        run: |
          VERSION="${TAG#v}"
          # The same DMG also goes up under a fixed name, so a permanent link always gets the
          # newest stable build: .../releases/latest/download/AutoSwitchKVM-macos.dmg (the website's
          # Download for Mac button). The versioned file stays the one the appcast points at.
          cp "build/release/AutoSwitchKVM-$VERSION-macos.dmg" build/release/AutoSwitchKVM-macos.dmg
          FILES=("build/release/AutoSwitchKVM-$VERSION-macos.dmg" "build/release/AutoSwitchKVM-$VERSION-macos.dmg.sha256"
                 "build/release/AutoSwitchKVM-macos.dmg")
          [ -f build/release/appcast.xml ] && FILES+=("build/release/appcast.xml")
          gh release upload "$TAG" "${FILES[@]}" --clobber

      - name: Add macOS install notes to the release
        run: |
          VERSION="${TAG#v}"
          # The Windows workflow creates the release with its x64 upload, then merges the ARM64
          # assets; that merge might rewrite the body. releases.win-arm64.json is the last file it
          # uploads, so edit the body only after it appears (up to 30 min; then edit anyway, since
          # nothing else will touch the release).
          for i in $(seq 1 60); do
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'releases.win-arm64.json'; then
              echo "Windows uploads are complete."
              break
            fi
            [ "$i" = 60 ] && echo "::warning::releases.win-arm64.json never appeared; adding the notes anyway."
            sleep 30
          done
          BODY="$(gh release view "$TAG" --json body -q .body)"
          if [[ "$BODY" == *"<!-- macos-notes -->"* ]]; then exit 0; fi
          NOTES="$RUNNER_TEMP/notes.md"
          {
            printf '%s\n\n' "$BODY"
            echo "<!-- macos-notes -->"
            echo "### macOS"
            echo ""
            echo "Download \`AutoSwitchKVM-$VERSION-macos.dmg\` and drag AutoSwitch KVM into Applications."
            echo ""
            echo "The app isn't notarized by Apple yet, so macOS blocks the first open. Open it once, then"
            echo "go to System Settings ▸ Privacy & Security and click **Open Anyway** (or run"
            echo "\`xattr -dr com.apple.quarantine /Applications/AutoSwitchKVM.app\`). Later updates"
            echo "install from inside the app."
          } > "$NOTES"
          gh release edit "$TAG" --notes-file "$NOTES"

      - name: Keep the DMG as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: osx/build/release/
          if-no-files-found: ignore
