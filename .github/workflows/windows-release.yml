name: Windows release

# Push a tag like v0.2.0 to build the Windows installer and publish it as a GitHub release.
# Installed apps update themselves from these releases (Velopack, see windows/tools/release.ps1).
# A tag with a pre-release suffix (v0.2.0-beta.1) is published as a GitHub pre-release, which
# installed apps ignore (they only follow stable releases).
# Builds are unsigned for now: Windows SmartScreen warns on first run of the installer.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [ x64, arm64 ]
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Core
        if: matrix.arch == 'x64'
        run: dotnet test tests/AutoSwitchKVM.Core.Tests/AutoSwitchKVM.Core.Tests.csproj -c Release
      - name: Build release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/release.ps1 -Version $version -Arch ${{ matrix.arch }} -Download -Token $env:GH_TOKEN `
            -RepoUrl "${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: windows/releases/${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: release-x64
          path: windows/releases/x64
      - uses: actions/download-artifact@v4
        with:
          name: release-arm64
          path: windows/releases/arm64
      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool restore
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $pre = if ($version.Contains('-')) { @('--pre') } else { @() }
          $common = @('--repoUrl', "${{ github.server_url }}/${{ github.repository }}", '--token', $env:GH_TOKEN,
                      '--tag', $tag, '--releaseName', "AutoSwitch KVM $version", '--publish') + $pre
          # x64 creates the release; arm64 merges its assets into it.
          dotnet vpk upload github -o releases/x64 --channel win @common
          if ($LASTEXITCODE -ne 0) { throw "x64 upload failed" }
          dotnet vpk upload github -o releases/arm64 --channel win-arm64 --merge @common
          if ($LASTEXITCODE -ne 0) { throw "arm64 upload failed" }
